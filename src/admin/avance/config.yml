# Configuration de l'administration du site DeeeMines.
# Rien à modifier ici pour l'usage courant.

backend:
  name: github
  repo: DeeeMines/deeemines-site
  branch: main
  # Adresse du petit service qui gère la connexion GitHub depuis /admin.
  # Elle est fournie par Cloudflare au moment où l'on installe ce service.
  # Tant qu'elle est vide, le bouton « se connecter » ne fonctionne pas.
  base_url: https://sveltia-cms-auth.david-merino.workers.dev

# Où sont rangées les images, et sous quel chemin la page les appelle
media_folder: src/assets
public_folder: /assets

# Le site est bilingue : chaque texte existe en français et en anglais,
# affichés côte à côte dans le formulaire. Le français fait référence.
i18n:
  structure: single_file
  locales: [fr, en]
  default_locale: fr

collections:
  # ------------------------------------------------------------------ ACTUALITÉS
- name: equipe
  label: Équipe
  i18n: true
  files:
  - name: membres
    label: Équipe
    file: src/_data/equipe.json
    format: json
    i18n: true
    fields:
    - label: Cofondateurs
      label_singular: Cofondateur
      name: cofondateurs
      widget: list
      i18n: true
      summary: '{{fields.nom}}'
      fields:
      - {label: Photo, name: photo, widget: image, i18n: duplicate}
      - {label: Nom, name: nom, widget: string, i18n: duplicate}
      - {label: Fonction, name: role, widget: string, i18n: true}
      - {label: Texte, name: texte, widget: text, i18n: true}
      - label: Logos d'affiliation
        label_singular: Logo
        name: logos
        widget: list
        i18n: duplicate
        summary: '{{fields.nom}}'
        fields:
        - {label: Image, name: image, widget: image}
        - {label: Texte de remplacement, name: nom, widget: string}

    - label: Équipe scientifique
      label_singular: Chercheur
      name: scientifiques
      widget: list
      i18n: true
      summary: '{{fields.nom}}'
      fields:
      - {label: Photo, name: photo, widget: image, i18n: duplicate}
      - {label: Nom, name: nom, widget: string, i18n: duplicate}
      - {label: Texte, name: texte, widget: text, i18n: true}
      - label: Logos d'affiliation
        label_singular: Logo
        name: logos
        widget: list
        i18n: duplicate
        summary: '{{fields.nom}}'
        fields:
        - {label: Image, name: image, widget: image}
        - {label: Texte de remplacement, name: nom, widget: string}

  # ------------------------------------------------------------------ PARTENAIRES
- name: actualites
  label: Actualités
  i18n: true
  files:
  - name: liste
    label: Actualités
    file: src/_data/actualites.json
    format: json
    i18n: true
    fields:
    - label: Actualités
      label_singular: Actualité
      name: articles
      widget: list
      i18n: true
      summary: '{{fields.date}} — {{fields.titre}}'
      fields:
      - {label: Date affichée, name: date, widget: string, hint: "Par exemple : Juillet 2026", i18n: true}
      - {label: Catégorie, name: categorie, widget: string, hint: "Financement, Société, Technologie, Partenariat…", i18n: true}
      - {label: Titre, name: titre, widget: string, i18n: true}
      - {label: Résumé, name: resume, widget: text, i18n: true, hint: "Deux ou trois lignes. C'est ce qui s'affiche dans la liste des actualités."}
      - label: Article complet (facultatif)
        name: corps
        widget: markdown
        required: false
        default: ""
        i18n: true
        hint: "Si vous remplissez ce champ, l'actualité obtient sa propre page et un lien « Lire la suite ». Sinon, seul le résumé est affiché."
      - {label: Adresse de la page, name: slug, widget: string, required: false, default: "", i18n: duplicate, hint: "Par exemple prix-i-phd. Ne la changez plus une fois l'article partagé : les liens existants cesseraient de fonctionner."}
      - {label: Image principale (facultative), name: image, widget: image, required: false, default: "", i18n: duplicate, hint: "Affichée en haut de la page de l'article."}
      - label: Cadrage de l'image
        name: cadrage
        widget: select
        required: false
        default: "50%"
        i18n: duplicate
        hint: "L'image est recadrée au format du bandeau. Choisissez la partie à conserver si le sujet n'est pas au centre."
        options:
        - {label: "Haut", value: "0%"}
        - {label: "Plutôt vers le haut", value: "25%"}
        - {label: "Centre", value: "50%"}
        - {label: "Plutôt vers le bas", value: "78%"}
        - {label: "Bas", value: "100%"}
      - label: Photos supplémentaires
        name: photos
        widget: list
        required: false
        i18n: true
        label_singular: Photo
        summary: '{{fields.legende}}'
        fields:
        - {label: Image, name: image, widget: image}
        - {label: Légende, name: legende, widget: string, required: false, default: ""}
        - label: Cadrage
          name: cadrage
          widget: select
          required: false
          default: "50%"
          options:
          - {label: "Haut", value: "0%"}
          - {label: "Plutôt vers le haut", value: "25%"}
          - {label: "Centre", value: "50%"}
          - {label: "Plutôt vers le bas", value: "78%"}
          - {label: "Bas", value: "100%"}
      - {label: Lien externe (facultatif), name: lien, widget: string, required: false, default: "", hint: "Adresse complète, par exemple https://…", i18n: duplicate}
      - {label: Texte du lien (facultatif), name: lien_texte, widget: string, required: false, default: "", hint: "Par défaut : « En savoir plus »", i18n: true}

  # ------------------------------------------------------------------ ACCUEIL
- name: partenaires
  label: Logos des partenaires
  i18n: true
  files:
  - name: logos
    label: Logos des partenaires
    file: src/_data/partenaires.json
    format: json
    fields:
    - label: Logos
      label_singular: Logo
      name: logos
      widget: list
      summary: '{{fields.nom}}'
      hint: "Format PNG à fond transparent, hauteur d'environ 100 pixels."
      fields:
      - {label: Image, name: image, widget: image}
      - {label: Nom affiché aux lecteurs d'écran, name: nom, widget: string}

  # ═══════════ Les textes du site ═══════════
  # Chaque page du site a son entrée. À l'intérieur, les textes sont rangés
  # par section, dans l'ordre où ils apparaissent à l'écran. Le volet de
  # droite montre le site réel : il se met à jour à la frappe.
