# Configuration de l'administration du site DeeeMines.
# Rien à modifier ici pour l'usage courant.

backend:
  name: github
  repo: DeeeMines/deeemines-site
  branch: main
  # Adresse du petit service qui gère la connexion GitHub depuis /admin.
  # Elle est fournie par Cloudflare au moment où l'on installe ce service.
  # Tant qu'elle est vide, le bouton « se connecter » ne fonctionne pas.
  base_url: https://sveltia-cms-auth.david-merino.workers.dev

# Où sont rangées les images, et sous quel chemin la page les appelle
media_folder: src/assets
public_folder: /assets

# Le site est bilingue : chaque texte existe en français et en anglais,
# affichés côte à côte dans le formulaire. Le français fait référence.
i18n:
  structure: single_file
  locales: [fr, en]
  default_locale: fr

collections:
